<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>盲盒外卖 · 今天吃什么</title>
  <meta name="description" content="选择困难症救星：4 个大类、25 个细分分类、264 道菜；转盘或条件筛选，随机决定今天吃什么。" />
  <meta name="theme-color" content="#FFF6E9" />
  <meta name="color-scheme" content="light" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="盲盒外卖" />
  <meta property="og:title" content="盲盒外卖 · 今天吃什么" />
  <meta property="og:description" content="4 个大类、25 个细分分类、264 道菜；转盘 + 精准盲盒，随机决定今天吃什么。纯前端，打开就能用。" />
  <meta property="og:url" content="https://hanny-0303.github.io/blind-box-takeout/" />
  <meta property="og:image" content="https://hanny-0303.github.io/blind-box-takeout/docs/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-deco" aria-hidden="true">
    <span class="deco deco-1">🍜</span>
    <span class="deco deco-2">🥡</span>
    <span class="deco deco-3">🥢</span>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🥡</div>
        <div>
          <h1>盲盒外卖</h1>
          <p id="todayLabel">今天吃什么，交给它</p>
        </div>
      </div>
      <button class="profile-btn" id="profileBtn" type="button" aria-label="打开口味档案">
        <span class="profile-icon" aria-hidden="true">📋</span>
        <span class="profile-text">档案</span>
        <span class="badge" id="historyBadge" hidden>0</span>
      </button>
    </header>

    <nav class="tabs" id="tabs" data-active="wheel" aria-label="玩法切换">
      <span class="thumb" aria-hidden="true"></span>
      <button class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-wheel"
              id="tab-wheel" data-tab="wheel">🎡 转盘</button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-filter"
              id="tab-filter" data-tab="filter">🎲 精准盲盒</button>
    </nav>

    <main>
      <!-- ================= 转盘 ================= -->
      <section class="panel" id="panel-wheel" role="tabpanel" aria-labelledby="tab-wheel">
        <div class="stage">
          <div class="orbit" aria-hidden="true"></div>
          <div class="pointer" aria-hidden="true"><span></span></div>
          <canvas id="wheel" aria-label="食物转盘"></canvas>
          <button class="hub" id="spinBtn" type="button">
            <span class="hub-emoji" aria-hidden="true">🎲</span>
            <span class="hub-label" id="spinLabel">开转</span>
          </button>
        </div>

        <div class="stage-foot">
          <p class="hint">16 道候选，转到了就不许反悔</p>
          <button class="link-btn" id="shuffleWheel" type="button">换一批候选 ↻</button>
        </div>

        <div class="result-slot" id="wheelResult" aria-live="polite"></div>
      </section>

      <!-- ================= 精准盲盒 ================= -->
      <section class="panel" id="panel-filter" role="tabpanel" aria-labelledby="tab-filter" hidden>
        <p class="panel-lead">7 个条件，从 25 个细分分类、264 道菜里开盲盒。</p>

        <div class="filter-block">
          <div class="field-head">
            <span class="idx">01</span>
            <span class="field-title">分类</span>
            <span class="field-note">先选大类，再选小类</span>
          </div>
          <div class="chips" data-group="cat" id="catChips" role="group" aria-label="分类">
            <button type="button" class="chip" data-value="any" aria-pressed="true">随便</button>
            <button type="button" class="chip" data-value="cuisine" aria-pressed="false">🍣 菜系</button>
            <button type="button" class="chip" data-value="staple" aria-pressed="false">🍚 主食</button>
            <button type="button" class="chip" data-value="snack" aria-pressed="false">🍢 小吃</button>
            <button type="button" class="chip" data-value="drink" aria-pressed="false">🧋 饮品</button>
          </div>

          <div class="subcat-panel" id="subcatPanel" hidden>
            <div class="subcat-head">
              <span class="subcat-title" id="subcatLabel">菜系</span>
              <span class="subcat-hint">不选就是整个大类</span>
            </div>
            <div class="chips" id="subcatChips" role="group" aria-label="二级分类"></div>
          </div>
        </div>

        <div class="filter-block">
          <div class="field-head">
            <span class="idx">02</span>
            <span class="field-title">口味</span>
            <span class="field-note">想吃哪种味道</span>
          </div>
          <div class="chips" data-group="flavor" role="group" aria-label="口味">
            <button type="button" class="chip" data-value="any" aria-pressed="true">随便</button>
            <button type="button" class="chip" data-value="清淡" aria-pressed="false">清淡</button>
            <button type="button" class="chip" data-value="咸香" aria-pressed="false">咸香</button>
            <button type="button" class="chip" data-value="酸甜" aria-pressed="false">酸甜</button>
            <button type="button" class="chip" data-value="酸辣" aria-pressed="false">酸辣</button>
            <button type="button" class="chip" data-value="麻辣" aria-pressed="false">麻辣</button>
            <button type="button" class="chip" data-value="香辣" aria-pressed="false">香辣</button>
            <button type="button" class="chip" data-value="鲜香" aria-pressed="false">鲜香</button>
          </div>
        </div>

        <div class="filter-block">
          <div class="field-head">
            <span class="idx">03</span>
            <span class="field-title">辣度</span>
            <span class="field-note">能接受的上限</span>
          </div>
          <div class="chips" data-group="spice" role="group" aria-label="辣度">
            <button type="button" class="chip" data-value="any" aria-pressed="true">随便</button>
            <button type="button" class="chip" data-value="0" aria-pressed="false">不辣</button>
            <button type="button" class="chip" data-value="1" aria-pressed="false">微辣</button>
            <button type="button" class="chip" data-value="2" aria-pressed="false">正常辣</button>
            <button type="button" class="chip" data-value="3" aria-pressed="false">加辣</button>
          </div>
        </div>

        <div class="filter-block">
          <div class="field-head">
            <span class="idx">04</span>
            <span class="field-title">主要食材</span>
            <span class="field-note">今天想吃什么肉</span>
          </div>
          <div class="chips" data-group="protein" role="group" aria-label="主要食材">
            <button type="button" class="chip" data-value="any" aria-pressed="true">随便</button>
            <button type="button" class="chip" data-value="鸡肉" aria-pressed="false">鸡肉</button>
            <button type="button" class="chip" data-value="牛肉" aria-pressed="false">牛肉</button>
            <button type="button" class="chip" data-value="猪肉" aria-pressed="false">猪肉</button>
            <button type="button" class="chip" data-value="海鲜" aria-pressed="false">海鲜</button>
            <button type="button" class="chip" data-value="素食" aria-pressed="false">素食</button>
          </div>
        </div>

        <div class="filter-block">
          <div class="field-head">
            <span class="idx">05</span>
            <span class="field-title">做法</span>
            <span class="field-note">带汤还是干香</span>
          </div>
          <div class="chips" data-group="style" role="group" aria-label="做法">
            <button type="button" class="chip" data-value="any" aria-pressed="true">随便</button>
            <button type="button" class="chip" data-value="带汤" aria-pressed="false">带汤</button>
            <button type="button" class="chip" data-value="干香" aria-pressed="false">干香</button>
            <button type="button" class="chip" data-value="小炒" aria-pressed="false">小炒</button>
            <button type="button" class="chip" data-value="炸烤" aria-pressed="false">炸烤</button>
            <button type="button" class="chip" data-value="凉食" aria-pressed="false">凉食</button>
            <button type="button" class="chip" data-value="蒸煮" aria-pressed="false">蒸煮</button>
          </div>
        </div>

        <div class="filter-block">
          <div class="field-head">
            <span class="idx">06</span>
            <span class="field-title">新鲜度</span>
            <span class="field-note">按你的点单记录</span>
          </div>
          <div class="chips" data-group="fresh" role="group" aria-label="新鲜度">
            <button type="button" class="chip" data-value="any" aria-pressed="true">随便</button>
            <button type="button" class="chip" data-value="new" aria-pressed="false">✨ 尝鲜</button>
            <button type="button" class="chip" data-value="old" aria-pressed="false">💛 念旧</button>
          </div>
          <p class="tip" id="freshTip">
            <span class="tip-icon" aria-hidden="true">🗂️</span>
            <span id="freshTipText">还没有点单记录。选完点「就吃这个」就会自动记一笔，攒几次它就开始懂你了。</span>
          </p>
        </div>

        <div class="filter-block">
          <div class="field-head">
            <span class="idx">07</span>
            <span class="field-title">价格区间</span>
          </div>
          <div class="chips" data-group="price" role="group" aria-label="价格区间">
            <button type="button" class="chip" data-value="any" data-min="0" data-max="1000" aria-pressed="true">随便</button>
            <button type="button" class="chip" data-value="0-20" data-min="0" data-max="20" aria-pressed="false">¥20 以内</button>
            <button type="button" class="chip" data-value="20-40" data-min="20" data-max="40" aria-pressed="false">¥20–40</button>
            <button type="button" class="chip" data-value="40-60" data-min="40" data-max="60" aria-pressed="false">¥40–60</button>
            <button type="button" class="chip" data-value="60-100" data-min="60" data-max="100" aria-pressed="false">¥60–100</button>
            <button type="button" class="chip" data-value="100-1000" data-min="100" data-max="1000" aria-pressed="false">¥100 以上</button>
            <button type="button" class="chip" data-value="custom" aria-pressed="false">自定义</button>
          </div>

          <div class="custom-price" id="customPrice" hidden>
            <label>
              <span>最低</span>
              <input type="number" id="priceMin" inputmode="numeric" min="0" max="1000" step="1" value="0" /> 元
            </label>
            <span class="dash" aria-hidden="true">—</span>
            <label>
              <span>最高</span>
              <input type="number" id="priceMax" inputmode="numeric" min="0" max="1000" step="1" value="1000" /> 元
            </label>
          </div>
        </div>

        <div class="pick-wrap">
          <button class="btn btn-primary pick-btn" id="pickBtn" type="button">
            <span aria-hidden="true">🎲</span> 帮我挑一个
          </button>
        </div>

        <div class="result-slot" id="filterResult" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-foot">
      记录只存在你的浏览器里 · 换台设备就重新开始
    </footer>
  </div>

  <!-- ================= 口味档案 ================= -->
  <div class="sheet-overlay" id="sheetOverlay" hidden></div>
  <aside class="sheet" id="profileSheet" aria-label="口味档案" aria-hidden="true">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <p class="sheet-kicker">口味档案</p>
        <h2 id="sheetTitle">你的外卖记忆</h2>
      </div>
      <button class="icon-btn" id="closeSheet" type="button" aria-label="关闭档案">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;text-align:center;">这个小玩意儿需要开启 JavaScript 才能转起来。</p>
  </noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
